apiVersion: batch/v1
kind: Job

metadata:
  name: grafana-bootstrap
  namespace: observability

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: bootstrap

          image: alpine:3.20

          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              /scripts/bootstrap.sh

          envFrom:
            - secretRef:
                name: grafana-bootstrap-secret

          volumeMounts:
            - name: script
              mountPath: /scripts

      volumes:
        - name: script
          configMap:
            name: grafana-bootstrap-script
            defaultMode: 0755

  backoffLimit: 1