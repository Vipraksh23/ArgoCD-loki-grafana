apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-bootstrap-script
  namespace: observability

data:

  bootstrap.sh: |
    #!/bin/sh

    set -e

    GRAFANA_URL=http://grafana.observability.svc.cluster.local

    export GRAFANA_URL

    echo "Waiting for Grafana..."

    until curl -s $GRAFANA_URL/api/health >/dev/null
    do
        echo "Grafana not ready..."
        sleep 5
    done

    echo "Grafana is ready."

    echo "==============================="
    echo "Creating Teams..."
    sh /scripts/teams.sh

    echo "==============================="
    echo "Creating Users..."
    sh /scripts/users.sh

    echo "==============================="
    echo "Adding Users To Teams..."
    sh /scripts/team-members.sh

    echo "==============================="
    echo "Creating Folders..."
    sh /scripts/folders.sh

    echo "==============================="
    echo "Applying Permissions..."
    sh /scripts/permissions.sh

    echo
    echo "Bootstrap completed."

  teams.sh: |
    #!/bin/sh

    set -e

    curl -s \
    -X POST \
    -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
    -H "Content-Type: application/json" \
    -d '{"name":"developers"}' \
    $GRAFANA_URL/api/teams || true

    curl -s \
    -X POST \
    -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
    -H "Content-Type: application/json" \
    -d '{"name":"devops"}' \
    $GRAFANA_URL/api/teams || true

    curl -s \
    -X POST \
    -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
    -H "Content-Type: application/json" \
    -d '{"name":"viewers"}' \
    $GRAFANA_URL/api/teams || true

    echo
    echo "Teams created."

  users.sh: |
    #!/bin/sh

    set -e

    create_user () {

    curl -s \
    -X POST \
    -u "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
    -H "Content-Type: application/json" \
    -d "{
    \"name\":\"$1\",
    \"email\":\"$2\",
    \"login\":\"$3\",
    \"password\":\"$4\"
    }" \
    $GRAFANA_URL/api/admin/users || true

    }

    create_user dev1 dev1@example.com dev1 Dev12345!
    create_user dev2 dev2@example.com dev2 Dev12345!

    create_user ops1 ops1@example.com ops1 Dev12345!
    create_user ops2 ops2@example.com ops2 Dev12345!

    create_user viewer1 viewer1@example.com viewer1 Dev12345!

    echo
    echo "Users created."

  team-members.sh: |
    #!/bin/sh

    set -e

    AUTH="-u ${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}"

    TEAM_DEV=$(curl -s $AUTH "$GRAFANA_URL/api/teams/search?name=developers" | jq -r '.teams[0].id')
    TEAM_OPS=$(curl -s $AUTH "$GRAFANA_URL/api/teams/search?name=devops" | jq -r '.teams[0].id')
    TEAM_VIEW=$(curl -s $AUTH "$GRAFANA_URL/api/teams/search?name=viewers" | jq -r '.teams[0].id')

    add_member() {

      TEAM=$1
      LOGIN=$2

      USER_ID=$(curl -s $AUTH \
        "$GRAFANA_URL/api/users/lookup?loginOrEmail=$LOGIN" \
        | jq -r '.id')

      echo "Adding user $LOGIN (id=$USER_ID) to team $TEAM"

      curl -s \
        -X POST \
        $AUTH \
        -H "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "userId=$USER_ID" \
        "$GRAFANA_URL/api/teams/$TEAM/members" || true
    }

    add_member $TEAM_DEV dev1
    add_member $TEAM_DEV dev2

    add_member $TEAM_OPS ops1
    add_member $TEAM_OPS ops2

    add_member $TEAM_VIEW viewer1

    echo
    echo "Members added."

  folders.sh: |
    #!/bin/sh

    set -e

    AUTH="-u ${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}"

    create_folder() {

      NAME=$1

      EXISTS=$(curl -s $AUTH \
        "$GRAFANA_URL/api/folders" \
        | jq -r ".[] | select(.title==\"$NAME\") | .uid" \
        | head -n1)

      if [ -n "$EXISTS" ]; then
        echo "$NAME already exists."
        return
      fi

      curl -s \
        -X POST \
        $AUTH \
        -H "Content-Type: application/json" \
        -d "{\"title\":\"$NAME\"}" \
        "$GRAFANA_URL/api/folders"

      echo
    }

    create_folder Development
    create_folder Operations

    echo
    echo "Folders created."

  permissions.sh: |
    #!/bin/sh

    set -e

    AUTH="-u ${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}"

    DEV_FOLDER=$(curl -s $AUTH \
      "$GRAFANA_URL/api/folders" \
      | jq -r '.[] | select(.title=="Development") | .uid' \
      | head -n1)

    OPS_FOLDER=$(curl -s $AUTH \
      "$GRAFANA_URL/api/folders" \
      | jq -r '.[] | select(.title=="Operations") | .uid' \
      | head -n1)

    DEV_TEAM=$(curl -s $AUTH \
      "$GRAFANA_URL/api/teams/search?name=developers" \
      | jq -r '.teams[0].id')

    OPS_TEAM=$(curl -s $AUTH \
      "$GRAFANA_URL/api/teams/search?name=devops" \
      | jq -r '.teams[0].id')

    VIEW_TEAM=$(curl -s $AUTH \
      "$GRAFANA_URL/api/teams/search?name=viewers" \
      | jq -r '.teams[0].id')

    echo "Development Folder UID: $DEV_FOLDER"
    echo "Operations Folder UID: $OPS_FOLDER"

    curl -s \
      -X POST \
      $AUTH \
      -H "Content-Type: application/json" \
      -d "{
        \"items\": [
          {
            \"teamId\": $DEV_TEAM,
            \"permission\": 2
          },
          {
            \"teamId\": $VIEW_TEAM,
            \"permission\": 1
          }
        ]
      }" \
      "$GRAFANA_URL/api/folders/$DEV_FOLDER/permissions"

    echo

    curl -s \
      -X POST \
      $AUTH \
      -H "Content-Type: application/json" \
      -d "{
        \"items\": [
          {
            \"teamId\": $OPS_TEAM,
            \"permission\": 2
          },
          {
            \"teamId\": $VIEW_TEAM,
            \"permission\": 1
          }
        ]
      }" \
      "$GRAFANA_URL/api/folders/$OPS_FOLDER/permissions"

    echo
    echo "Folder permissions applied."