apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - job.yaml
  - secret.yaml

configMapGenerator:
  - name: grafana-bootstrap-script
    files:
      - bootstrap.sh
      - scripts/teams.sh
      - scripts/users.sh
      - scripts/team-members.sh
      - scripts/folders.sh
      - scripts/permissions.sh

generatorOptions:
  disableNameSuffixHash: true
