apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana-bootstrap
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Vipraksh23/ArgoCD-loki-grafana.git
    targetRevision: master
    path: grafana/bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
